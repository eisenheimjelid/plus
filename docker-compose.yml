services:
  web:
    image: node:lts-slim
    ports:
      - 80:80
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - MONGODB_URI=mongodb://db:27017/plus
      - MONGODB_DB=plus
      - SLACK_VERIFICATION_TOKEN=xxxxxxxxxxxxxxxxxxxxxxx1
      - SLACK_BOT_USER_OAUTH_ACCESS_TOKEN=
      - YARN_PRODUCTION=true
    entrypoint: node index.js
    depends_on:
      - db

  db:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
